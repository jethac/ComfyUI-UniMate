[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-unimate"
version = "0.1.0"
description = "UniMate skeletal animation nodes for ComfyUI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "scipy>=1.11",
    "einops>=0.8",
    "torch-geometric>=2.7,<3",
    "torchdiffeq>=0.2.5,<0.3",
    "transformers>=5.8,<6",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/jethac/ComfyUI-UniMate"

[tool.setuptools.packages.find]
include = ["unimate_pack*"]

[tool.setuptools.package-data]
"unimate_pack._vendor" = ["LICENSE*", "SOURCES.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: requires a Blender executable",
    "integration: requires ComfyUI or installed model artifacts",
    "gpu: runs model inference on an available accelerator",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
